[tool.poetry]
authors = ["Rob Kirberich <rob@kirberich.uk>"]
description = "Solder stencil generator, converts gerber files to a 3d-printable openSCAD solder stencil"
readme = 'README.md'
name = "gerber_to_scad"
version = "0.2.2"

[tool.poetry.dependencies]
pcb-tools = "^0.1.6"
python = ">=3.10,<4"
scipy = "^1.10.1"
typing-extensions = "^4.15.0"
pygerber = {extras = ["svg"], version = "^2.4.3"}
solidpython = "^1.1.3"
setuptools = ">=67.0.0,<81"
click = "^8.3.1"
tomli = "^2.0"

[tool.poetry.extras]
service = ["Django", "environs", "django-ninja", "gunicorn", "uvicorn", "whitenoise"]

[tool.poetry.dependencies.uvicorn]
version = "^0.47.0"
optional = true

[tool.poetry.dependencies.Django]
version = "^5.2"
optional = true

[tool.poetry.dependencies.environs]
version = "*"
extras = ["django"]
optional = true

[tool.poetry.dependencies.django-ninja]
version = "*"
optional = true

[tool.poetry.dependencies.gunicorn]
version = "*"
optional = true

[tool.poetry.dependencies.whitenoise]
version = "*"
optional = true

[tool.poetry.scripts]
gerber_to_scad = "gerber_to_scad.cli:gerber_to_scad_cli"

[tool.poetry.group.dev.dependencies]
ruff = "^0.9.3"
basedpyright = "^1.37.1"
django-stubs = "^5.2.9"
pytest = "^9.0.3"
pytest-django = "^4.9"

[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core>=1.0.0"]

[tool.basedpyright]
typeCheckingMode = "strict"
reportMissingTypeStubs = 'none'
reportUnknownMemberType = 'none'
reportUnknownArgumentType = 'none'

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
